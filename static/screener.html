<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrendPulse — Screener</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%2312151c'/%3E%3Cpath d='M4 16H9L11 10L14.5 20L17 8L19.5 16H24' stroke='%2335e28a' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='8' r='1.7' fill='%23ff9f40'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  /* No overflow-x:hidden here on purpose: setting overflow-x alone (per the
     CSS Overflow spec) forces the computed overflow-y from its default
     'visible' to 'auto', turning body into its own scroll/clip container --
     which then clipped the search dropdown's absolutely-positioned overflow
     on short pages instead of letting it paint past the fold. box-sizing:
     border-box below is what actually fixed the horizontal-scroll bug. */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    max-width: 1280px;
    margin: 64px auto 40px;
    padding: 0 20px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #999; margin-bottom: 24px; font-size: 14px; }
  .panel {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; margin-top: 0; color: #ccc; }
  input[type=text] {
    background: #0f1115;
    border: 1px solid #333;
    color: #eee;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    max-width: 100%;
  }
  button {
    background: #3b6ef6;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #2f57c9; }
  button.secondary { background: #2a2e38; }
  button.secondary:hover { background: #3a3f4c; }
  button:disabled { opacity: 0.5; cursor: default; }
  .empty { color: #777; font-size: 13px; padding: 10px 0; }
  #status { font-size: 13px; color: #7fdc9c; margin-left: 10px; }
  .nav { margin-bottom: 20px; display: flex; flex-wrap: wrap; row-gap: 8px; align-items: center; }
  .nav a { color: #999; text-decoration: none; margin-right: 20px; font-size: 14px; padding-bottom: 4px; }
  .nav a.active { color: #e6e6e6; border-bottom: 2px solid #3b6ef6; }
  .nav a:hover { color: #e6e6e6; }
  .nav-right {
    position: absolute;
    top: 16px;
    right: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .nav-icon { margin-right: 0 !important; display: flex; align-items: center; padding-bottom: 4px; }
  .nav-icon svg { display: block; }
  .tp-brand {
    position: absolute;
    top: 16px;
    left: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 9px;
    line-height: 1.3;
  }
  .tp-logo { flex-shrink: 0; display: block; }
  .tp-brand-name { display: block; font-weight: 700; font-size: 14px; color: #e6e6e6; letter-spacing: -0.3px; }
  .tp-brand-tag { display: block; font-size: 10.5px; color: #6b7280; }

  /* Search */
  .search-wrap { position: relative; max-width: 480px; width: 100%; }
  .search-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 8px;
    z-index: 40;
    display: none;
  }
  .search-dropdown.open { display: block; }
  .search-result {
    padding: 9px 12px;
    cursor: pointer;
    border-bottom: 1px solid #21252e;
    font-size: 13px;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: #1e222c; }
  .search-result-symbol { font-weight: 600; margin-right: 8px; }
  .search-result-name { color: #999; word-break: break-word; }
  .search-result-exchange { color: #666; font-size: 11px; float: right; }

  /* Stock header */
  .stock-header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; }
  .stock-name { font-size: 19px; font-weight: 700; word-break: break-word; }
  .stock-ticker { color: #888; font-size: 14px; }
  .stock-meta { color: #888; font-size: 12.5px; width: 100%; word-break: break-word; }
  .stock-price-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-left: auto; }
  .stock-price {
    font-size: 24px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    min-width: 5.5ch;
    display: inline-block;
  }
  #stockChange {
    font-variant-numeric: tabular-nums;
    min-width: 5.5ch;
    display: inline-block;
  }
  .change-pos { color: #4ade80; font-weight: 600; }
  .change-neg { color: #f87171; font-weight: 600; }

  /* Chart */
  .range-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 10px; }
  .range-buttons button { padding: 5px 11px; font-size: 12.5px; background: #2a2e38; }
  .range-buttons button.active { background: #3b6ef6; }
  #chartContainer { max-width: 100%; }
  #chartContainer svg { width: 100%; max-width: 100%; height: 240px; display: block; cursor: crosshair; touch-action: none; }
  .chart-hover-label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px;
    fill: #ccc;
    font-weight: 600;
  }
  .live-badge { display: none; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #4ade80; }
  .live-dot { animation: livePulse 1.4s ease-in-out infinite; }
  @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .stat-box { background: #12151c; border: 1px solid #21252e; border-radius: 8px; padding: 10px 12px; }
  .stat-label { color: #888; font-size: 11.5px; margin-bottom: 3px; }
  .stat-value { font-size: 14.5px; font-weight: 600; }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #262a33; }
  th { color: #999; font-weight: 500; }
  td:first-child, th:first-child { text-align: left; font-weight: 600; }

  .news-item { padding: 10px 0; border-bottom: 1px solid #262a33; font-size: 13px; }
  .news-item:last-child { border-bottom: none; }
  .news-item a { color: #e6e6e6; text-decoration: none; word-break: break-word; }
  .news-item a:hover { color: #6fa1ff; }
  .news-publisher { color: #888; font-size: 11px; margin-top: 2px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) {
    .two-col { grid-template-columns: 1fr; }
    .stock-price-row { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="tp-brand">
  <svg class="tp-logo" width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0.5" y="0.5" width="27" height="27" rx="7" fill="#12151c" stroke="#2a2e38"/>
    <path d="M4 16H9L11 10L14.5 20L17 8L19.5 16H24" stroke="#35e28a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="8" r="1.7" fill="#ff9f40"/>
  </svg>
  <div>
    <span class="tp-brand-name">TrendPulse</span>
    <span class="tp-brand-tag">Trade the plan, not the moment.</span>
  </div>
</div>

<h1>Screener</h1>
<div class="nav">
  <a href="/watchlist">Watchlist</a>
  <a href="/autotrade">AutoTrade</a>
  <a href="/screener" class="active">Screener</a>
  <a href="/sentiment">Sentiment</a>
  <div class="nav-right">
    <a href="/profile" class="nav-icon" title="Profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
      </svg>
    </a>
    <a href="/logout">Log Out</a>
  </div>
</div>
<div class="subtitle">Search any stock to see its chart, fundamentals, earnings, financials, and news.</div>

<div class="panel">
  <h2>Find a stock</h2>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search by ticker or company name..." autocomplete="off" style="width: 100%;">
    <div class="search-dropdown" id="searchDropdown"></div>
  </div>
  <span id="status"></span>
</div>

<div id="resultArea"></div>

<script>
let currentTicker = null;
let currentRange = '1M';
let searchDebounce = null;
let searchResults = [];
let currentSnapshot = null;
let chartCoords = [];
let chartPointsRef = [];
let liveInterval = null;
const LIVE_UPDATE_INTERVAL_MS = 60000;

const RANGES = ['1D', '1W', '1M', '3M', '6M', '1Y', '5Y'];

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.style.color = isError ? '#f87171' : '#7fdc9c';
}

// ---------- Search ----------

const searchInput = document.getElementById('searchInput');
const searchDropdown = document.getElementById('searchDropdown');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  clearTimeout(searchDebounce);
  if (!q) {
    searchDropdown.classList.remove('open');
    return;
  }
  searchDebounce = setTimeout(() => runSearch(q), 300);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim().toUpperCase();
    if (q) {
      clearTimeout(searchDebounce);
      searchDropdown.classList.remove('open');
      loadStock(q);
    }
  } else if (e.key === 'Escape') {
    clearTimeout(searchDebounce);
    searchDropdown.classList.remove('open');
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) searchDropdown.classList.remove('open');
});

async function runSearch(q) {
  try {
    const res = await fetch('/api/stock-search?q=' + encodeURIComponent(q));
    searchResults = await res.json();
  } catch {
    searchResults = [];
  }

  if (searchResults.length === 0) {
    searchDropdown.classList.remove('open');
    return;
  }

  searchDropdown.innerHTML = searchResults.map((r, i) => `
    <div class="search-result" onclick="selectSearchResult(${i})">
      <span class="search-result-exchange">${r.exchange || ''}</span>
      <span class="search-result-symbol">${r.symbol}</span>
      <span class="search-result-name">${r.name}</span>
    </div>
  `).join('');
  searchDropdown.classList.add('open');
}

function selectSearchResult(i) {
  const r = searchResults[i];
  clearTimeout(searchDebounce);
  searchDropdown.classList.remove('open');
  searchInput.value = r.symbol;
  loadStock(r.symbol);
}

// ---------- Formatting ----------

function fmtCompact(n) {
  if (n === null || n === undefined) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (abs >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return (n / 1e3).toFixed(2) + 'K';
  return n.toFixed(2);
}

function fmtNum(n, decimals) {
  if (n === null || n === undefined) return '—';
  return n.toFixed(decimals === undefined ? 2 : decimals);
}

function fmtPct(n) {
  if (n === null || n === undefined) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function changeClass(n) {
  if (n === null || n === undefined) return '';
  return n >= 0 ? 'change-pos' : 'change-neg';
}

// ---------- Loading a stock ----------

async function loadStock(ticker) {
  clearTimeout(searchDebounce);
  searchDropdown.classList.remove('open');
  setStatus('Loading ' + ticker + '...');
  document.getElementById('resultArea').innerHTML = '<div class="panel empty">Loading ' + ticker + '...</div>';

  const res = await fetch('/api/stock/' + encodeURIComponent(ticker));
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    document.getElementById('resultArea').innerHTML =
      '<div class="panel empty">' + (body.detail || ('Could not load ' + ticker + '.')) + '</div>';
    setStatus('');
    return;
  }

  const data = await res.json();
  currentTicker = data.snapshot.ticker;
  setStatus('');
  renderStock(data);
  currentRange = '1M';
  loadChart();
}

function renderStock(data) {
  const s = data.snapshot;
  currentSnapshot = s;

  let html = '<div class="panel">';
  html += '<div class="stock-header">';
  html += '<div><span class="stock-name">' + s.name + '</span> <span class="stock-ticker">' + s.ticker + '</span></div>';
  html += '<div class="stock-price-row">';
  html += '<span class="stock-price" id="stockPrice">' + (s.price !== null ? '$' + fmtNum(s.price) : '—') + '</span>';
  html += '<span id="stockChange" class="' + changeClass(s.change_pct) + '">' + fmtPct(s.change_pct) + '</span>';
  html += '<span id="liveBadge" class="live-badge"><span class="live-dot">&#9679;</span> Live</span>';
  html += '<button onclick="addToWatchlist(\'' + s.ticker + '\')">+ Add to Watchlist</button>';
  html += '</div>';
  if (s.sector || s.industry) {
    html += '<div class="stock-meta">' + [s.sector, s.industry].filter(Boolean).join(' · ') + '</div>';
  }
  html += '</div>';

  html += '<div class="range-buttons">' + RANGES.map(r =>
    '<button data-range="' + r + '" class="' + (r === currentRange ? 'active' : '') + '" onclick="setRange(\'' + r + '\')">' + r + '</button>'
  ).join('') + '</div>';
  html += '<div id="chartContainer"><div class="empty">Loading chart...</div></div>';
  html += '</div>';

  html += '<div class="panel">';
  html += '<h2>Key Stats</h2>';
  html += '<div class="stats-grid">';
  html += statBox('Market Cap', '$' + fmtCompact(s.market_cap));
  html += statBox('Volume', fmtCompact(s.volume));
  html += statBox('Avg Volume', fmtCompact(s.avg_volume));
  html += statBox('52W High', s.week52_high !== null ? '$' + fmtNum(s.week52_high) : '—');
  html += statBox('52W Low', s.week52_low !== null ? '$' + fmtNum(s.week52_low) : '—');
  html += statBox('PE Ratio', fmtNum(s.pe_ratio));
  html += statBox('Forward PE', fmtNum(s.forward_pe));
  html += statBox('EPS (Annual)', s.eps !== null ? '$' + fmtNum(s.eps) : '—');
  html += statBox('Forward EPS', s.forward_eps !== null ? '$' + fmtNum(s.forward_eps) : '—');
  html += statBox('Dividend Yield', s.dividend_yield !== null ? fmtNum(s.dividend_yield) + '%' : '—');
  html += '</div></div>';

  html += '<div class="two-col">';

  html += '<div class="panel">';
  html += '<h2>Earnings</h2>';
  html += '<div class="subtitle" style="margin-bottom:12px;">' +
    (data.earnings.next_date ? 'Next report: ' + data.earnings.next_date : 'No upcoming earnings date found.') + '</div>';
  if (data.earnings.history.length === 0) {
    html += '<div class="empty">No earnings history available.</div>';
  } else {
    html += '<div class="table-scroll"><table><tr><th>Date</th><th>Estimate</th><th>Actual</th><th>Surprise</th></tr>';
    data.earnings.history.forEach(e => {
      html += '<tr><td>' + e.date + '</td><td>' + fmtNum(e.estimate_eps) + '</td><td>' + fmtNum(e.reported_eps) +
        '</td><td class="' + changeClass(e.surprise_pct) + '">' + fmtPct(e.surprise_pct) + '</td></tr>';
    });
    html += '</table></div>';
  }
  html += '</div>';

  html += '<div class="panel">';
  html += '<h2>Quarterly Financials</h2>';
  if (data.financials.length === 0) {
    html += '<div class="empty">No financial data available.</div>';
  } else {
    html += '<div class="table-scroll"><table><tr><th>Quarter</th><th>Revenue</th><th>Net Income</th></tr>';
    data.financials.forEach(q => {
      html += '<tr><td>' + q.quarter + '</td><td>$' + fmtCompact(q.revenue) + '</td><td>$' + fmtCompact(q.net_income) + '</td></tr>';
    });
    html += '</table></div>';
  }
  html += '</div>';

  html += '</div>';

  html += '<div class="panel">';
  html += '<h2>News</h2>';
  html += '<div id="newsList">' + renderNews(data.news) + '</div>';
  html += '</div>';

  document.getElementById('resultArea').innerHTML = html;
}

function statBox(label, value) {
  return '<div class="stat-box"><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div></div>';
}

function renderNews(items) {
  if (!items || items.length === 0) return '<div class="empty">No recent news found.</div>';
  return items.map(n => `
    <div class="news-item">
      <a href="${n.link || '#'}" target="_blank" rel="noopener">${n.title}</a>
      <div class="news-publisher">${n.publisher || ''}</div>
    </div>
  `).join('');
}

async function addToWatchlist(ticker) {
  await fetch('/api/watchlist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticker })
  });
  setStatus(ticker + ' added to your Watchlist.');
}

// ---------- Chart ----------

function setRange(r) {
  currentRange = r;
  document.querySelectorAll('.range-buttons button').forEach(b => {
    b.classList.toggle('active', b.dataset.range === r);
  });
  loadChart();
}

async function loadChart() {
  if (!currentTicker) return;
  const container = document.getElementById('chartContainer');
  if (!container) return;
  container.innerHTML = '<div class="empty">Loading chart...</div>';

  const ticker = currentTicker;
  const range = currentRange;
  const res = await fetch('/api/stock/' + encodeURIComponent(ticker) + '/chart?range=' + range);
  const data = await res.json();

  // A range/ticker switch may have happened while this was in flight --
  // don't paint a stale response over whatever the user is looking at now.
  if (ticker !== currentTicker || range !== currentRange) return;

  renderChart(data.points);
  updateLiveBadge();
  startLiveUpdatesIfNeeded();
}

function updateLiveBadge() {
  const badge = document.getElementById('liveBadge');
  if (badge) badge.style.display = currentRange === '1D' ? 'inline-flex' : 'none';
}

function stopLiveUpdates() {
  if (liveInterval) {
    clearInterval(liveInterval);
    liveInterval = null;
  }
}

function startLiveUpdatesIfNeeded() {
  stopLiveUpdates();
  if (currentRange !== '1D') return;
  liveInterval = setInterval(() => {
    if (currentRange === '1D' && currentTicker) loadChart();
  }, LIVE_UPDATE_INTERVAL_MS);
}

function formatChartDateFull(iso) {
  const d = new Date(iso);
  if (currentRange === '1D') {
    return d.toLocaleString('en-US', { hour: 'numeric', minute: '2-digit' });
  }
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// Catmull-Rom -> cubic Bezier, so the line curves smoothly through every
// point instead of the sharp zig-zag a plain polyline gives.
function smoothPath(coords) {
  if (coords.length < 3) {
    return 'M' + coords.map(p => p.x + ',' + p.y).join(' L');
  }
  let d = `M${coords[0].x},${coords[0].y} `;
  for (let i = 0; i < coords.length - 1; i++) {
    const p0 = coords[i - 1] || coords[i];
    const p1 = coords[i];
    const p2 = coords[i + 1];
    const p3 = coords[i + 2] || p2;
    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;
    d += `C${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)} `;
  }
  return d;
}

function renderChart(points) {
  const container = document.getElementById('chartContainer');
  if (!container) return;

  chartPointsRef = points || [];
  chartCoords = [];

  if (!points || points.length < 2) {
    container.innerHTML = '<div class="empty">Not enough chart data for this range.</div>';
    return;
  }

  const W = 600, H = 240, PAD_TOP = 20, PAD_BOTTOM = 10, PAD_X = 6;
  const closes = points.map(p => p.c);
  const min = Math.min(...closes);
  const max = Math.max(...closes);
  const range = (max - min) || 1;
  const baseline = H - PAD_BOTTOM;

  const xAt = i => PAD_X + (i / (points.length - 1)) * (W - PAD_X * 2);
  const yAt = c => PAD_TOP + (1 - (c - min) / range) * (H - PAD_TOP - PAD_BOTTOM);

  chartCoords = points.map((p, i) => ({ x: xAt(i), y: yAt(p.c) }));

  const linePath = smoothPath(chartCoords);
  const last = chartCoords[chartCoords.length - 1];
  const first = chartCoords[0];
  const areaPath = `${linePath} L${last.x},${baseline} L${first.x},${baseline} Z`;

  const isUp = closes[closes.length - 1] >= closes[0];
  const color = isUp ? '#4ade80' : '#f87171';
  const gradId = 'chartGrad-' + currentRange;

  container.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="chartSvg"
         onmousemove="handleChartHover(event)" onmouseleave="handleChartLeave()"
         ontouchstart="handleChartHover(event)" ontouchmove="handleChartHover(event)" ontouchend="handleChartLeave()">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.32" />
          <stop offset="100%" stop-color="${color}" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="url(#${gradId})" stroke="none" />
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" />
      <line id="hoverGuide" x1="0" y1="${PAD_TOP}" x2="0" y2="${baseline}" stroke="#666" stroke-width="1" stroke-dasharray="3,3" opacity="0" />
      <circle id="hoverDot" r="4.5" fill="${color}" stroke="#0f1115" stroke-width="2" opacity="0" />
      <text id="hoverDateLabel" x="0" y="${PAD_TOP}" class="chart-hover-label" text-anchor="middle" opacity="0"></text>
    </svg>
  `;

  paintHeaderBaseline();
}

// ---------- Chart hover / scrub ----------

function handleChartHover(evt) {
  if (!chartCoords.length) return;
  const svg = document.getElementById('chartSvg');
  if (!svg) return;
  evt.preventDefault();

  const touch = (evt.touches && evt.touches[0]) || (evt.changedTouches && evt.changedTouches[0]);
  const clientX = touch ? touch.clientX : evt.clientX;
  const rect = svg.getBoundingClientRect();
  if (!rect.width) return;
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  const idx = Math.round(ratio * (chartCoords.length - 1));

  const point = chartPointsRef[idx];
  const coord = chartCoords[idx];
  if (!point || !coord) return;

  const guide = document.getElementById('hoverGuide');
  const dot = document.getElementById('hoverDot');
  const dateLabel = document.getElementById('hoverDateLabel');
  if (!guide || !dot || !dateLabel) return;

  guide.setAttribute('x1', coord.x);
  guide.setAttribute('x2', coord.x);
  guide.setAttribute('opacity', '1');
  dot.setAttribute('cx', coord.x);
  dot.setAttribute('cy', coord.y);
  dot.setAttribute('opacity', '1');
  dateLabel.setAttribute('x', Math.min(560, Math.max(40, coord.x)));
  dateLabel.setAttribute('y', Math.max(12, coord.y - 12));
  dateLabel.textContent = formatChartDateFull(point.t);
  dateLabel.setAttribute('opacity', '1');

  updateHeaderForHover(point);
}

function handleChartLeave() {
  const guide = document.getElementById('hoverGuide');
  const dot = document.getElementById('hoverDot');
  const dateLabel = document.getElementById('hoverDateLabel');
  if (guide) guide.setAttribute('opacity', '0');
  if (dot) dot.setAttribute('opacity', '0');
  if (dateLabel) dateLabel.setAttribute('opacity', '0');
  paintHeaderBaseline();
}

function updateHeaderForHover(point) {
  if (!chartPointsRef.length) return;
  const start = chartPointsRef[0].c;
  const change = point.c - start;
  const changePct = start ? (change / start) * 100 : 0;

  const priceEl = document.getElementById('stockPrice');
  const changeEl = document.getElementById('stockChange');
  if (priceEl) priceEl.textContent = '$' + point.c.toFixed(2);
  if (changeEl) {
    changeEl.textContent = fmtPct(changePct);
    changeEl.className = changeClass(changePct);
  }
}

// The non-hover baseline. Two different metrics depending on range:
//  - 1D: "today's change" is always measured against YESTERDAY's close,
//    not today's first intraday bar (which misses overnight gaps) -- and
//    the price shown tracks the latest intraday bar, so it actually moves
//    as the live poll brings in new bars instead of sitting frozen at
//    whatever price loaded on page-open.
//  - Any other range: the period's total return (first bar of the range
//    -> current price), so 1Y shows the 1-year return, not today's %.
function paintHeaderBaseline() {
  if (!currentSnapshot) return;
  const priceEl = document.getElementById('stockPrice');
  const changeEl = document.getElementById('stockChange');

  let price = currentSnapshot.price;
  let changePct = currentSnapshot.change_pct;

  if (currentRange === '1D') {
    if (chartPointsRef.length) {
      price = chartPointsRef[chartPointsRef.length - 1].c;
    }
    const prevClose = currentSnapshot.previous_close;
    if (prevClose && price !== null && price !== undefined) {
      changePct = ((price - prevClose) / prevClose) * 100;
    }
  } else if (chartPointsRef.length >= 2 && chartPointsRef[0].c) {
    const startClose = chartPointsRef[0].c;
    const endClose = (price !== null && price !== undefined) ? price : chartPointsRef[chartPointsRef.length - 1].c;
    changePct = ((endClose - startClose) / startClose) * 100;
  }

  if (priceEl) priceEl.textContent = price !== null ? '$' + fmtNum(price) : '—';
  if (changeEl) {
    changeEl.textContent = fmtPct(changePct);
    changeEl.className = changeClass(changePct);
  }
}
</script>
