<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrendPulse — Users</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%2312151c'/%3E%3Cpath d='M4 16H9L11 10L14.5 20L17 8L19.5 16H24' stroke='%2335e28a' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='8' r='1.7' fill='%23ff9f40'/%3E%3C/svg%3E">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    max-width: 1280px;
    margin: 64px auto 40px;
    padding: 0 20px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #999; margin-bottom: 24px; font-size: 14px; }
  .panel {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; margin-top: 0; color: #ccc; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #262a33; }
  th { color: #999; font-weight: 500; }
  #usersTable { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .empty { color: #777; font-size: 13px; padding: 10px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-on { background: #1f3a2c; color: #6fdc9c; }
  .badge-off { background: #2a2e38; color: #888; }
  .badge-admin { background: #2a2440; color: #b39ddb; }
  .nav { margin-bottom: 20px; display: flex; align-items: center; }
  .nav a { color: #999; text-decoration: none; margin-right: 20px; font-size: 14px; padding-bottom: 4px; }
  .nav a.active { color: #e6e6e6; border-bottom: 2px solid #3b6ef6; }
  .nav a:hover { color: #e6e6e6; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
  .nav-icon { margin-right: 0 !important; display: flex; align-items: center; padding-bottom: 4px; }
  .nav-icon svg { display: block; }
  .tp-brand {
    position: absolute;
    top: 16px;
    left: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 9px;
    line-height: 1.3;
  }
  .tp-logo { flex-shrink: 0; display: block; }
  .tp-brand-name { display: block; font-weight: 700; font-size: 14px; color: #e6e6e6; letter-spacing: -0.3px; }
  .tp-brand-tag { display: block; font-size: 10.5px; color: #6b7280; }
</style>
</head>
<body>

<div class="tp-brand">
  <svg class="tp-logo" width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0.5" y="0.5" width="27" height="27" rx="7" fill="#12151c" stroke="#2a2e38"/>
    <path d="M4 16H9L11 10L14.5 20L17 8L19.5 16H24" stroke="#35e28a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="8" r="1.7" fill="#ff9f40"/>
  </svg>
  <div>
    <span class="tp-brand-name">TrendPulse</span>
    <span class="tp-brand-tag">Trade the plan, not the moment.</span>
  </div>
</div>

<h1>Users</h1>
<div class="nav">
  <a href="/watchlist">Watchlist</a>
  <a href="/autotrade">AutoTrade</a>
  <a href="/shop">Shop</a>
  <div class="nav-right">
    <a href="/profile" class="nav-icon" title="Profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
      </svg>
    </a>
    <a href="/logout">Log Out</a>
  </div>
</div>
<div class="subtitle">Everyone registered on this site, newest first. Admin-only.</div>

<div class="panel">
  <h2>Registered Users</h2>
  <div id="usersTable"></div>
</div>

<script>
async function loadUsers() {
  const container = document.getElementById('usersTable');
  const res = await fetch('/api/admin/users');

  if (res.status === 403) {
    container.innerHTML = '<div class="empty">Admin access required.</div>';
    return;
  }

  const users = await res.json();

  if (users.length === 0) {
    container.innerHTML = '<div class="empty">No users yet.</div>';
    return;
  }

  let html = '<table><tr><th>Username</th><th>Name</th><th>Email</th><th>Registered</th><th>AutoTrade</th><th></th></tr>';
  users.forEach(u => {
    const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || '—';
    const registered = (u.created_at || '').split(' ')[0] || '—';

    let autotradeBadge = '<span class="badge badge-off">Off</span>';
    if (u.autotrade_enabled && u.has_alpaca_keys) {
      autotradeBadge = '<span class="badge badge-on">On</span>';
    } else if (u.autotrade_enabled && !u.has_alpaca_keys) {
      autotradeBadge = '<span class="badge badge-off">On, no keys</span>';
    }

    const adminBadge = u.is_admin ? '<span class="badge badge-admin">Admin</span>' : '';

    html += `<tr>
      <td>${u.username}</td>
      <td>${name}</td>
      <td>${u.email}</td>
      <td>${registered}</td>
      <td>${autotradeBadge}</td>
      <td>${adminBadge}</td>
    </tr>`;
  });
  html += '</table>';
  container.innerHTML = html;
}

loadUsers();
</script>

</body>
</html>
