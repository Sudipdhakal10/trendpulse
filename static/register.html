<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register — TrendPulse</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='7' fill='%2312151c'/%3E%3Cpath d='M4 16H9L11 10L14.5 20L17 8L19.5 16H24' stroke='%2335e28a' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='17' cy='8' r='1.7' fill='%23ff9f40'/%3E%3C/svg%3E">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 80px 20px 40px;
  }
  .card {
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 36px;
    width: min(480px, 90vw);
    box-sizing: border-box;
  }
  @media (max-width: 420px) {
    .card { padding: 24px; }
    .field-row { flex-direction: column; gap: 0; }
  }
  h1 { font-size: 18px; margin-top: 0; margin-bottom: 20px; text-align: center; }
  label { font-size: 13px; color: #999; display: block; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    background: #0f1115;
    border: 1px solid #333;
    color: #eee;
    padding: 10px;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }
  .hint { font-size: 11.5px; color: #6b7280; margin-top: 5px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; min-width: 0; }
  button {
    width: 100%;
    background: #3b6ef6;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-top: 22px;
  }
  button:hover { background: #2f57c9; }
  .error { color: #f87171; font-size: 13px; margin-top: 14px; text-align: center; display: none; }
  a { color: #6fa1ff; text-decoration: none; font-size: 13px; }
  .back { display: block; text-align: center; margin-top: 18px; }
  .login-hint { text-align: center; font-size: 13px; color: #999; margin-top: 16px; }
  .tp-brand {
    position: absolute;
    top: 16px;
    left: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.3;
  }
  .tp-logo { flex-shrink: 0; display: block; }
  .tp-brand-name { display: block; font-weight: 700; font-size: 14px; color: #e6e6e6; letter-spacing: -0.3px; }
  .tp-brand-tag { display: block; font-size: 10.5px; color: #6b7280; }
</style>
</head>
<body>

<div class="tp-brand">
  <svg class="tp-logo" width="26" height="26" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="0.5" y="0.5" width="27" height="27" rx="7" fill="#12151c" stroke="#2a2e38"/>
    <path d="M4 16H9L11 10L14.5 20L17 8L19.5 16H24" stroke="#35e28a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17" cy="8" r="1.7" fill="#ff9f40"/>
  </svg>
  <div>
    <span class="tp-brand-name">TrendPulse</span>
    <span class="tp-brand-tag">Trade the plan, not the moment.</span>
  </div>
</div>

<div class="card">
  <h1>TrendPulse</h1>
  <p style="text-align:center; color:#999; font-size:13px; margin-top:-14px; margin-bottom:22px;">Create your own desk</p>
  <form id="registerForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <div class="hint">3-32 characters: letters, numbers, "_", ".", "-"</div>

    <div class="field-row">
      <div>
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" autocomplete="given-name">
      </div>
      <div>
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" autocomplete="family-name">
      </div>
    </div>

    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" required>
    <div class="hint">Where your alert emails will be sent</div>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" autocomplete="tel" placeholder="e.g. (555) 123-4567">

    <label for="street">Street Address</label>
    <input type="text" id="street" autocomplete="address-line1">

    <div class="field-row">
      <div style="flex: 2;">
        <label for="city">City</label>
        <input type="text" id="city" autocomplete="address-level2">
      </div>
      <div>
        <label for="state">State</label>
        <input type="text" id="state" autocomplete="address-level1" maxlength="2" placeholder="e.g. CA">
      </div>
      <div>
        <label for="zipCode">ZIP Code</label>
        <input type="text" id="zipCode" autocomplete="postal-code">
      </div>
    </div>

    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" required>
    <div class="hint">At least 8 characters</div>

    <button type="submit">Create Account</button>
    <div class="error" id="errorMsg"></div>
  </form>
  <div class="login-hint">Already have an account? <a href="/login">Log in</a></div>
  <a class="back" href="/">&larr; Back home</a>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';

  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username,
      email,
      password,
      first_name: document.getElementById('firstName').value.trim(),
      last_name: document.getElementById('lastName').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      street: document.getElementById('street').value.trim(),
      city: document.getElementById('city').value.trim(),
      state: document.getElementById('state').value.trim(),
      zip_code: document.getElementById('zipCode').value.trim(),
    })
  });

  if (res.ok) {
    window.location.href = '/watchlist';
  } else {
    const data = await res.json().catch(() => ({}));
    errorMsg.textContent = data.detail || 'Could not create account.';
    errorMsg.style.display = 'block';
  }
});
</script>

</body>
</html>
